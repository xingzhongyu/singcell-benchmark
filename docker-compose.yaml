version: '3.8'

services:
  redis:
    image: "redis:7-alpine"
    container_name: singcell_redis_container
    networks:
      - app-network
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    image: singcell/fastapi-backend
    container_name: singcell_backend_container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009 --reload
    ports:
      - "8009:8009"
    networks:
      - app-network
    depends_on:
      - redis
      - deepsem
      - grnboost2
      - cefcon
      - scdgrn
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FASTAPI_ENV=development
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEEPSEM_BASE_URL=http://deepsem:8002
      - GRNBOOST2_BASE_URL=http://grnboost2:8003
      - CEFCON_BASE_URL=http://cefcon:8004
      - SCDGRN_BASE_URL=http://scdgrn:8005
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./figures:/app/figures
      - ./sample_data:/app/sample_data
      - ./cellphonedb_data:/app/cellphonedb_data

  deepsem:
    build: ./DeepSEM
    image: singcell/deepsem
    container_name: singcell_deepsem_container
    command: uvicorn main:app --host 0.0.0.0 --port 8002  --reload
    networks:
      - app-network
    ports:
      - "8002:8002"
    volumes:
      - ./DeepSEM:/app
    # GPU 支持配置 - 使用 nvidia runtime
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  grnboost2:
    build: ./GRNBoost2
    image: singcell/grnboost2
    container_name: singcell_grnboost2_container
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    networks:
      - app-network
    ports:
      - "8003:8003"
    volumes:
      - ./GRNBoost2:/app

  cefcon:
    build: ./CEFCON
    image: singcell/cefcon
    container_name: singcell_cefcon_container
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --reload
    networks:
      - app-network
    ports:
      - "8004:8004"
    volumes:
      - ./CEFCON:/app
    # GPU 支持配置 - 使用 nvidia runtime（如果需要）
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  scdgrn:
    build: ./scDGRN
    image: singcell/scdgrn
    container_name: singcell_scdgrn_container
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    networks:
      - app-network
    ports:
      - "8005:8005"
    volumes:
      - ./scDGRN:/app
    # GPU 支持配置 - 使用 nvidia runtime
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  worker:
    build: ./backend
    image: singcell/fastapi-backend
    container_name: singcell_celery_worker_container
    command: celery -A celery_app.celery_app worker --loglevel=info
    networks:
      - app-network
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./figures:/app/figures
      - ./sample_data:/app/sample_data
      - ./cellphonedb_data:/app/cellphonedb_data

  frontend:
    build:
      context: ./frontend
      target: builder
      args:
        - REACT_APP_BACKEND_URL=http://sdu-112:8009/api
    container_name: singcell_frontend_container
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3002:3002"
    networks:
      - app-network
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_BACKEND_URL=http://sdu-112:8009/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:

